services:
  - type: web
    name: aquametric-web-demo
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: AquaMetric
      - key: WEB_DEMO_MODE
        value: "1"
      - key: DATABASE_URL
        value: sqlite:////tmp/aquametric_demo.db
      - key: UPLOAD_DIR
        value: /tmp/aquametric_uploads
      - key: EVIDENCE_DIR
        value: /tmp/aquametric_evidence
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: AUTO_REFRESH_OFFICIAL_DATA
        value: "1"
      - key: OFFICIAL_REFRESH_LOOP_MINUTES
        value: "30"
      - key: COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
