{% extends 'base.html' %}{% block content %}<div class="panel"><span class="eyebrow">NEW ANALYSIS</span><h1>Create a match</h1>{% if teams %}<form method="post" action="/matches" enctype="multipart/form-data"><div class="formgrid"><label>Team<select name="team_id">{% for t in teams %}<option value="{{t.id}}">{{t.name}}</option>{% endfor %}</select></label><label>Opponent<input name="opponent" required></label><label>Competition<input name="competition"></label><label>Date<input type="date" name="match_date"></label></div><label>Video URL<input name="video_url" placeholder="YouTube or supported remote URL"></label><div class="or">OR</div><label>Upload video<input type="file" name="video_file" accept="video/mp4,video/webm,video/quicktime,video/ogg,.m4v"></label><small>Local MVP upload limit: {{max_upload_mb}} MB. MP4/WebM are recommended for browser playback.</small><button class="btn">Create match</button></form>{% else %}<p>Create a team first.</p><a class="btn" href="/teams">Create team</a>{% endif %}</div>{% endblock %}
