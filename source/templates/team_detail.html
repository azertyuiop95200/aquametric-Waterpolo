{% extends 'base.html' %}{% block content %}<div class="topline"><div><span class="eyebrow">TEAM</span><h1>{{team.name}}</h1><p>{{team.club.name}} · {{team.category}}</p></div><a class="btn" href="/matches/new">Analyze match</a></div><div class="twocol"><section class="panel"><h2>Add player</h2><form method="post" action="/teams/{{team.id}}/players"><label>Name<input name="name" required></label><label>Cap number<input name="cap_number" inputmode="numeric"></label><button class="btn">Add</button></form></section><section class="panel"><h2>Players</h2>{% for p in team.players %}<a class="listrow roster-link" href="/players/{{p.id}}"><b>#{{p.cap_number or '—'}} {{p.name}} <small>→ profile</small></b><span>{{p.primary_role}}</span></a>{% else %}<p>No players yet.</p>{% endfor %}</section></div>{% endblock %}
