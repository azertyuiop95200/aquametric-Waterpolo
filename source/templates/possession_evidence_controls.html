<details><summary>Possessions : annoter une fenêtre de contrôle</summary>
<p>Le temps vidéo du formulaire est la borne de fin. Choisir la même vidéo pour les deux bornes. Le champ note décrit les preuves avant/après, la cause et la décision éventuelle.</p>
<label>Début vidéo (s)<input name="p_start" type="number" min="0" max="43200" step="0.04"></label>
<label>Équipe avant<select name="p_before"><option value="unknown">Inconnue</option><option value="for">Notre équipe</option><option value="against">Adversaire</option></select></label><label>Preuve avant<select name="p_bs"><option value="unknown">Inconnue</option><option value="apparent">Apparente</option><option value="observed">Observée</option></select></label>
<label>Équipe après<select name="p_after"><option value="unknown">Inconnue</option><option value="for">Notre équipe</option><option value="against">Adversaire</option></select></label><label>Preuve après<select name="p_as"><option value="unknown">Inconnue</option><option value="apparent">Apparente</option><option value="observed">Observée</option></select></label>
<label>Cause candidate<select name="p_cause"><option value="unknown">Indéterminée</option><option value="goal">But</option><option value="shot_saved">Tir arrêté</option><option value="shot_blocked">Tir contré</option><option value="shot_post">Poteau</option><option value="shot_crossbar">Barre</option><option value="shot_wide">Hors cadre</option><option value="shot_unknown">Tir issue inconnue</option><option value="shot_non_goal">Tir non marqué</option><option value="penalty_goal">Penalty marqué</option><option value="penalty_saved">Penalty arrêté</option><option value="penalty_missed">Penalty manqué</option><option value="penalty_post">Penalty sur montant</option><option value="penalty_violation">Infraction penalty</option><option value="offensive_foul">Contre-faute offensive</option><option value="ball_under_water">Ballon enfoncé</option><option value="two_hands">Deux mains</option><option value="illegal_entry">Entrée irrégulière</option><option value="offside_goal_area">Zone de but irrégulière</option><option value="impeding">Entrave</option><option value="illegal_restart">Reprise irrégulière</option><option value="shot_clock_expired">Expiration chrono</option><option value="defensive_ordinary_foul">Faute ordinaire défensive</option><option value="defensive_exclusion">Exclusion défensive</option><option value="penalty_awarded">Penalty accordé</option><option value="simultaneous_foul">Fautes simultanées</option><option value="timeout_illegal">Temps mort irrégulier</option><option value="misconduct">Conduite antisportive</option><option value="other_foul">Autre faute</option><option value="pass_intercepted">Passe interceptée</option><option value="pass_inaccurate">Passe imprécise</option><option value="pass_into_water">Passe dans l'eau</option><option value="pass_dropped">Réception manquée</option><option value="pass_deflected">Passe déviée</option><option value="ball_stolen">Ballon arraché</option><option value="ball_lost_under_pressure">Perte sous pression</option><option value="unforced_loss">Perte non provoquée</option><option value="bad_control">Mauvais contrôle</option><option value="ball_out">Sortie</option><option value="dribble_lost">Perte en conduite</option><option value="ball_disputed">Ballon disputé</option><option value="corner">Corner</option><option value="goal_throw">Renvoi de but</option><option value="neutral_throw">Entre-deux</option><option value="timeout">Temps mort</option><option value="period_start">Début période</option><option value="period_end">Fin période</option><option value="post_goal_restart">Reprise après but</option><option value="free_throw">Jet franc</option><option value="rebound">Rebond</option><option value="keeper_recovery">Récupération gardienne</option><option value="referee_correction">Correction arbitrale</option></select></label>
<label><input type="checkbox" name="p_cv" value="1"> Cause effectivement vérifiée</label>
<label><input type="checkbox" name="p_dv" value="1"> Décision arbitrale identifiée et documentée</label>
<label>Reprise attribuée à<select name="p_ra"><option value="unknown">Non établie</option><option value="for">Notre équipe</option><option value="against">Adversaire</option><option value="neutral">Entre-deux / neutre</option></select></label>
<label><input type="checkbox" name="p_rv" value="1"> Attribution de reprise vérifiée (distincte du contrôle)</label>
<label><input type="checkbox" name="p_exact" value="1"> Transition unique vérifiée sans lacune entre les deux contrôles</label>
<label><input type="checkbox" name="p_prior" value="1"> Déjà liée à un tir recensé</label>
<button class="btn secondary" type="submit" name="event_type" value="possession_transition">Enregistrer la fenêtre de possession</button></details>
