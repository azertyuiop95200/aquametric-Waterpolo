name: Verify live AquaMetric Render

on:
  workflow_run:
    workflows: ["AquaMetric V12 CI"]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait briefly for Render and detect deployed main HEAD
        id: live
        env:
          EVENT_TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          base='https://aquametric-web-demo.onrender.com'
          marker='AQUAMETRIC_V12_7_ULTIMATE_VISUAL_ANALYSIS_2026_09_04'
          target=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')
          if [ -z "$target" ]; then
            target="$EVENT_TARGET_SHA"
          fi
          echo "Event target: $EVENT_TARGET_SHA"
          echo "Current main HEAD target: $target"
          for i in $(seq 1 8); do
            echo "Live check $i/8"
            health=$(curl -L --max-time 30 -fsS "$base/health" 2>/dev/null || true)
            release=$(curl -L --max-time 30 -fsS "$base/static/release.json" 2>/dev/null || true)
            echo "Live health: ${health:-unavailable}"
            if [ -n "$target" ] && echo "$health" | grep -q '"ok":true' && echo "$health" | grep -q "\"git_commit\":\"$target\"" && echo "$release" | grep -q "$marker"; then
              echo "Current main HEAD is live on Render: $target"
              echo "deployed=true" >> "$GITHUB_OUTPUT"
              echo "target_sha=$target" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "deployed=false" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"
          echo "::error::Render has not exposed current main HEAD $target within the verification window."
          exit 1

      - name: Verify public security and V12.7 product assets
        if: ${{ steps.live.outputs.deployed == 'true' }}
        run: |
          set -euo pipefail
          base='https://aquametric-web-demo.onrender.com'
          curl -L --max-time 30 -fsS "$base/security-status" | tee /tmp/security.json
          grep -q '"security_headers":true' /tmp/security.json
          grep -q '"api_docs_public":false' /tmp/security.json
          curl -L --max-time 30 -fsS "$base/static/app.js" | grep -q 'menuBackdrop'
          curl -L --max-time 30 -fsS "$base/static/tactical-board-audit.js?v=2026.09.04.1" | grep -q 'board-personnel'
          curl -L --max-time 30 -fsS "$base/static/elite-video-atlas.html" | grep -q '2026-09-04-full-7v7'
          curl -L --max-time 30 -fsS "$base/static/elite-video-atlas.html" | grep -q '6 défenseures X1–X6'
          curl -L --max-time 30 -fsS "$base/knowledge" | grep -q 'tactic-board-card'
          curl -L --max-time 30 -fsS "$base/scouting" | grep -q 'scout-card'

      - name: Verify Ultimate analysis library is actually served
        if: ${{ steps.live.outputs.deployed == 'true' }}
        run: |
          set -euo pipefail
          base='https://aquametric-web-demo.onrender.com'
          cookie=/tmp/aquametric-analysis-cookie.txt
          curl -L --max-time 45 -fsS -c "$cookie" -b "$cookie" "$base/demo-login" >/tmp/demo.html
          curl -L --max-time 45 -fsS -c "$cookie" -b "$cookie" "$base/analysis-library" >/tmp/analysis-library.html
          grep -q "Bibliothèque d'analyse opérationnelle" /tmp/analysis-library.html
          grep -q 'Résultats réellement produits' /tmp/analysis-library.html
          detail_path=$(grep -oE '/analysis-library/[0-9]+' /tmp/analysis-library.html | head -1 || true)
          if [ -n "$detail_path" ]; then
            curl -L --max-time 45 -fsS -c "$cookie" -b "$cookie" "$base$detail_path" >/tmp/analysis-detail.html
            grep -q 'VIDÉO SOURCE · LECTURE DIRECTE' /tmp/analysis-detail.html
            grep -q 'Player stats' /tmp/analysis-detail.html
            grep -q 'Tactical notes' /tmp/analysis-detail.html
            grep -q 'Traçabilité' /tmp/analysis-detail.html
            grep -q 'RELECTURE QUART PAR QUART' /tmp/analysis-detail.html
          fi
          echo 'Ultimate analysis library is live and verified.'

      - name: Verify Coaches directory is actually served
        if: ${{ steps.live.outputs.deployed == 'true' }}
        run: |
          set -euo pipefail
          base='https://aquametric-web-demo.onrender.com'
          cookie=/tmp/aquametric-cookie.txt
          curl -L --max-time 45 -fsS -c "$cookie" -b "$cookie" "$base/demo-login" >/tmp/demo.html
          curl -L --max-time 45 -fsS -c "$cookie" -b "$cookie" "$base/coaches" >/tmp/coaches.html
          grep -q 'data-coach-directory-version="2026-08-28-v2"' /tmp/coaches.html
          grep -q 'data-season="2026-2027"' /tmp/coaches.html
          grep -q 'data-season="2025-2026"' /tmp/coaches.html
          grep -q 'data-view="national"' /tmp/coaches.html
          grep -q 'coach-directory.js?v=20260828-2' /tmp/coaches.html
          curl -L --max-time 30 -fsS "$base/static/coach-directory.js?v=20260828-2" | grep -q "const CURRENT = '2026-2027'"
          echo 'Coaches directory v2 is live and verified.'
