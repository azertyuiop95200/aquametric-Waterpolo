name: Verify live AquaMetric Render

on:
  workflow_run:
    workflows: ["AquaMetric V12 CI"]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Render and verify deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          base='https://aquametric-web-demo.onrender.com'
          marker='AQUAMETRIC_V12_1_FINAL_2026_08_28'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main"
          for i in $(seq 1 45); do
            echo "Live check $i/45"
            latest=$(curl -L --max-time 20 -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))' 2>/dev/null || true)
            health=$(curl -L --max-time 30 -fsS "$base/health" 2>/dev/null || true)
            release=$(curl -L --max-time 30 -fsS "$base/static/release.json" 2>/dev/null || true)
            echo "Live health: ${health:-unavailable}"
            if [ -n "$latest" ] && echo "$health" | grep -q '"ok":true' && echo "$health" | grep -q "\"git_commit\":\"$latest\"" && echo "$release" | grep -q "$marker"; then
              echo "Current main commit is live on Render: $latest"
              exit 0
            fi
            [ -n "$latest" ] && echo "Waiting for Render to serve main commit: $latest"
            sleep 15
          done
          echo 'Render did not expose the current main commit within the verification window.'
          exit 1
      - name: Verify public security and V12.2 product assets
        run: |
          base='https://aquametric-web-demo.onrender.com'
          curl -L --max-time 30 -fsS "$base/security-status" | tee /tmp/security.json
          grep -q '"security_headers":true' /tmp/security.json
          grep -q '"api_docs_public":false' /tmp/security.json
          curl -L --max-time 30 -fsS "$base/static/app.js" | grep -q 'menuBackdrop'
          curl -L --max-time 30 -fsS "$base/static/i18n.js" | grep -q 'aquametric.language'
          curl -L --max-time 30 -fsS "$base/static/i18n-v122.js" | grep -q 'history.title'
          curl -L --max-time 30 -fsS "$base/static/v122.css" | grep -q 'tactic-board'
          curl -L --max-time 30 -fsS "$base/knowledge" | grep -q 'tactic-board-card'
          curl -L --max-time 30 -fsS "$base/scouting" | grep -q 'scout-card'
