name: Verify live AquaMetric V12.2 Render

on:
  workflow_run:
    workflows: ["AquaMetric V12.2 CI"]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  LIVE_BASE_URL: https://aquametric-polo-coach.onrender.com

jobs:
  verify-live:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render and verify current V12.2 main HEAD
        id: live
        env:
          EVENT_TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          base="$LIVE_BASE_URL"
          marker='AQUAMETRIC_V12_2_ULTIMATE_MATCH_VIDEO_INTELLIGENCE_2026_09_05'
          target=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')
          if [ -z "$target" ]; then
            target="$EVENT_TARGET_SHA"
          fi
          echo "Event target: $EVENT_TARGET_SHA"
          echo "Current main HEAD target: $target"
          for i in $(seq 1 10); do
            echo "Live check $i/10"
            health=$(curl -L --max-time 30 -fsS "$base/health" 2>/dev/null || true)
            release=$(curl -L --max-time 30 -fsS "$base/static/release.json" 2>/dev/null || true)
            echo "Live health: ${health:-unavailable}"
            if [ -n "$target" ] \
              && echo "$health" | grep -q '"ok":true' \
              && echo "$health" | grep -q "\"git_commit\":\"$target\"" \
              && echo "$release" | grep -q '"product_version": "12.2.0"' \
              && echo "$release" | grep -q '"analysis_engine": "ultimate-analyst-v2.0"' \
              && echo "$release" | grep -q "$marker"; then
              echo "AquaMetric V12.2 current main HEAD is live on Render: $target"
              echo "deployed=true" >> "$GITHUB_OUTPUT"
              echo "target_sha=$target" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "deployed=false" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"
          echo "::error::Render has not exposed current V12.2 main HEAD $target within the verification window."
          exit 1

      - name: Verify public security and V12.2 product assets
        if: ${{ steps.live.outputs.deployed == 'true' }}
        run: |
          set -euo pipefail
          base="$LIVE_BASE_URL"
          curl -L --max-time 30 -fsS "$base/security-status" | tee /tmp/security.json
          grep -q '"security_headers":true' /tmp/security.json
          grep -q '"api_docs_public":false' /tmp/security.json
          curl -L --max-time 30 -fsS "$base/login" >/tmp/login.html
          grep -q 'workspace.css?v=20260908' /tmp/login.html
          grep -q 'lang="fr"' /tmp/login.html
          if grep -q 'src="/static/premium-product.js' /tmp/login.html; then
            echo '::error::Login unexpectedly loads match-only scripts.'
            exit 1
          fi
          curl -L --max-time 30 -fsS "$base/static/analysis-metrics-surface.js?v=12.2.0" | grep -q 'Toutes les données mesurées'
          curl -L --max-time 30 -fsS "$base/static/automatic-video-measurements.js?v=12.2.0" | grep -q 'Matrice de mesure'
          curl -L --max-time 30 -fsS "$base/static/premium-product.js?v=12.2.0" | grep -q 'EXECUTIVE COACH BRIEF'
          curl -L --max-time 30 -fsS "$base/static/tactical-board-audit.js?v=12.2.0" | grep -q 'board-personnel'

      - name: Verify current V12.2 Analysis Library surface is actually served
        if: ${{ steps.live.outputs.deployed == 'true' }}
        run: |
          set -euo pipefail
          base="$LIVE_BASE_URL"
          cookie=/tmp/aquametric-analysis-cookie.txt
          curl -L --max-time 45 -fsS -c "$cookie" -b "$cookie" "$base/demo-login" >/tmp/demo.html
          curl -L --max-time 45 -fsS -c "$cookie" -b "$cookie" "$base/analysis-library" >/tmp/analysis-library.html
          # The library and its scripts need to be tested independently:
          # don't silently reduce the check to HTTP 200 or an authentication page.
          require_library_fragment() {
            if ! grep -Fq -- "$1" /tmp/analysis-library.html; then
              echo "::error::Live Analysis Library HTML is missing required fragment: $1"
              echo "Page title: $(grep -o '<title>[^<]*</title>' /tmp/analysis-library.html | head -1 || true)"
              echo "Page size: $(wc -c </tmp/analysis-library.html) bytes"
              exit 1
            fi
          }
          require_library_fragment 'analysis-metrics-surface.js?v=12.2.0'
          require_library_fragment 'automatic-video-measurements.js?v=12.2.0'
          require_library_fragment 'premium-product.js?v=12.2.0'
          require_library_fragment 'Résultats, vidéos, preuves et ZIP'
          require_library_fragment 'vision / OCR / événements'
          require_library_fragment 'Analyse réelle, pas vitrine démo.'
          require_library_fragment 'Replays directement lisibles + données publiées'
          echo 'AquaMetric V12.2 current Analysis Library surface is live.'

      - name: Verify improved Ultimate analysis assets and routes
        if: ${{ steps.live.outputs.deployed == 'true' }}
        run: |
          set -euo pipefail
          base="$LIVE_BASE_URL"
          cookie=/tmp/aquametric-ultimate-cookie.txt
          curl -L --max-time 45 -fsS -c "$cookie" -b "$cookie" "$base/demo-login" >/tmp/demo.html
          curl -L --max-time 45 -fsS -c "$cookie" -b "$cookie" "$base/analysis-history" >/tmp/history.html
          grep -q 'Analysis' /tmp/history.html
          curl -L --max-time 30 -fsS "$base/static/analysis-metrics-surface.js?v=12.2.0" >/tmp/metrics.js
          grep -q 'DONNÉES MESURÉES & ANALYSÉES' /tmp/metrics.js
          grep -q 'Équipe, joueuses, tirs, passes, pertes, transitions, possession et mesures calibrées' /tmp/metrics.js
          curl -L --max-time 30 -fsS "$base/static/automatic-video-measurements.js?v=12.2.0" >/tmp/auto.js
          grep -q 'AUTO, CANDIDAT AUTO, TAGUÉ, CALIBRÉ ou NON MESURÉ' /tmp/auto.js
          grep -q 'non promus en stats joueuse sans validation' /tmp/auto.js
          echo 'AquaMetric V12.2 improved Ultimate analysis surface is live and verified.'

      - name: Verify Coaches directory is actually served
        if: ${{ steps.live.outputs.deployed == 'true' }}
        run: |
          set -euo pipefail
          base="$LIVE_BASE_URL"
          cookie=/tmp/aquametric-cookie.txt
          curl -L --max-time 45 -fsS -c "$cookie" -b "$cookie" "$base/demo-login" >/tmp/demo.html
          curl -L --max-time 45 -fsS -c "$cookie" -b "$cookie" "$base/coaches" >/tmp/coaches.html
          grep -q 'data-coach-directory-version="2026-08-28-v2"' /tmp/coaches.html
          grep -q 'data-season="2026-2027"' /tmp/coaches.html
          grep -q 'data-season="2025-2026"' /tmp/coaches.html
          grep -q 'data-view="national"' /tmp/coaches.html
          echo 'Coaches directory is live and verified.'