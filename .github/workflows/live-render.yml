name: Verify live AquaMetric Render

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/live-render.yml'
  workflow_dispatch:

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Render and verify current release marker
        run: |
          set -u
          base='https://aquametric-web-demo.onrender.com'
          marker='AQUAMETRIC_V12_1_FINAL_2026_08_28'
          for i in $(seq 1 45); do
            echo "Live check $i/45"
            health=$(curl -L --max-time 30 -fsS "$base/health" 2>/dev/null || true)
            release=$(curl -L --max-time 30 -fsS "$base/static/release.json" 2>/dev/null || true)
            if echo "$health" | grep -q '"ok":true' && echo "$release" | grep -q "$marker"; then
              echo "Latest AquaMetric release is live on Render."
              echo "$health"
              echo "$release"
              exit 0
            fi
            sleep 15
          done
          echo 'Render did not expose the latest release marker within the verification window.'
          exit 1

      - name: Verify public security and V12.1 assets
        run: |
          base='https://aquametric-web-demo.onrender.com'
          curl -L --max-time 30 -fsS "$base/security-status" | tee /tmp/security.json
          grep -q '"security_headers":true' /tmp/security.json
          grep -q '"api_docs_public":false' /tmp/security.json
          curl -L --max-time 30 -fsS "$base/static/app.js" | grep -q 'menuBackdrop'
          curl -L --max-time 30 -fsS "$base/static/i18n.js" | grep -q 'aquametric.language'
          curl -L --max-time 30 -fsS "$base/knowledge" | grep -q 'Classic water-polo tactics'
