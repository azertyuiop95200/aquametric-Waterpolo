name: Ultimate statistical audit
on:
  push:
    branches: [feature/ultimate-statistical-audit]
  pull_request:
    branches: [feature/elite-performance-2026]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile edited Python modules
        run: python -m py_compile source/main.py source/services/elite_performance.py source/services/spatial_match_analysis.py source/services/analysis_product.py source/services/statistical_audit.py source/services/advanced_observed_metrics.py
      - name: Focused evidence audit tests
        env:
          PYTHONPATH: source
        run: python -m unittest discover -s tests -p test_ultimate_statistical_audit.py -v
      - name: Verify the report templates
        run: |
          pip install jinja2
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          e=Environment(loader=FileSystemLoader('source/templates'))
          for name in ('statistical_audit.html','advanced_observed_metrics.html','analysis_all_measurements.html','analysis_result_clean_v2.html'):
              e.get_template(name)
              print(name, 'compiled')
          PY
