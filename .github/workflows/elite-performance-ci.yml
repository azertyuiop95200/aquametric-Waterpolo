name: Elite performance and extended guest checks
on:
  push:
    branches: [fix/youtube-report-intake-2026-11, feature/elite-performance-2026]
    paths: ['source/**','.github/workflows/elite-performance-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q source
      - working-directory: source
        run: python -m unittest discover -s tests -p test_elite_performance.py -v
      - run: pip install jinja2 fastapi sqlalchemy pytest pydantic opencv-python-headless numpy
      - working-directory: source
        run: |
          python -m unittest discover -s tests -p test_guest_full_policy.py -v
          python -m unittest discover -s tests -p test_recognition_quality.py -v
          python -m unittest discover -s tests -p test_ball_candidate_pixels.py -v
          python -m unittest discover -s tests -p test_broadcast_scoreboard.py -v
      - working-directory: source
        run: |
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          from services.elite_performance import elite_report
          from types import SimpleNamespace
          env = Environment(loader=FileSystemLoader('templates'))
          for name in ('_elite_performance.html','analysis_result_clean_v2.html','analysis_report_portable.html','login.html','guest.html','analysis_live_automatic_stats.html','_recognition_quality.html'):
              env.get_template(name)
          html = env.get_template('_elite_performance.html').render(review_metrics={'elite':elite_report([])},match=SimpleNamespace(team=SimpleNamespace(name='A'),opponent='B'))
          assert 'Ultimate' in html and '—' in html
          PY
      - working-directory: source
        env:
          PYTHONPATH: .
        run: python scripts/recognition_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-recognition-report
          path: source/test-output/
