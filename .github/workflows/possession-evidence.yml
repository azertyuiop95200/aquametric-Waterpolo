name: Possession evidence integration
on:
  pull_request:
    paths:
      - 'source/**'
      - 'tests/test_possession_evidence.py'
      - 'tests/test_review_reference_import.py'
      - 'tests/test_pass_review.py'
      - 'tests/test_review_coverage.py'
      - 'tests/test_retrospective_review.py'
      - 'tests/test_possession_context.py'
      - 'tests/test_local_object_tracking.py'
      - 'tests/test_ball_motion_review.py'
      - 'tests/test_detection_evaluation.py'
      - 'tests/test_calibration_validation.py'
      - 'source/tests/test_metric_field.py'
      - '.github/workflows/possession-evidence.yml'
jobs:
  possession-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install jinja2 sqlalchemy opencv-python-headless numpy
      - run: python -m py_compile source/main.py source/services/analysis_product.py source/services/possession_evidence.py source/services/review_reference_import.py source/services/pass_review.py source/services/review_coverage.py source/services/retrospective_review.py source/services/possession_context.py source/services/local_object_tracking.py source/services/local_clip_scan.py source/services/ball_motion_review.py source/services/detection_evaluation.py source/services/evidence_manifest.py source/services/review_reference_revision.py source/models.py
      - run: PYTHONPATH=source python -m unittest discover -s tests -p test_possession_evidence.py -v
      - run: PYTHONPATH=source python -m unittest discover -s tests -p test_review_reference_import.py -v
      - run: PYTHONPATH=source python -m unittest discover -s tests -p test_pass_review.py -v
      - run: PYTHONPATH=source python -m unittest discover -s tests -p test_review_coverage.py -v
      - run: PYTHONPATH=source python -m unittest discover -s tests -p test_retrospective_review.py -v
      - run: PYTHONPATH=source python -m unittest discover -s tests -p test_possession_context.py -v
      - run: PYTHONPATH=source python -m unittest discover -s tests -p test_local_object_tracking.py -v
      - run: PYTHONPATH=source python -m unittest discover -s tests -p test_ball_motion_review.py -v
      - run: PYTHONPATH=source python -m unittest discover -s tests -p test_detection_evaluation.py -v
      - run: PYTHONPATH=source python -m unittest discover -s source/tests -p test_metric_field.py -v
      - run: PYTHONPATH=source python -m unittest discover -s tests -p test_calibration_validation.py -v
      - run: |
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          e=Environment(loader=FileSystemLoader('source/templates'))
          for f in ('analysis_result_clean_v2.html','analysis_all_measurements.html','possession_evidence.html','possession_evidence_controls.html','review_reference_form.html','review_reference_report.html','pass_review_report.html','vision.html'):
              e.get_template(f)
          PY
