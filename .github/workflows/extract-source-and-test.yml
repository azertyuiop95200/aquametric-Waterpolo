name: Validate committed AquaMetric source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-source-and-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the committed application
        shell: bash
        run: |
          set -euo pipefail
          # The V11.2 bundle is a historical archive. Never replace maintained
          # source with it or push generated source from this validation job.
          test -f source/main.py
          test -f source/scripts/apply_v12_patch.py
          test -f source/scripts/install_dependencies.py
          test -f source/services/measurement_report.py
          test -f source/analysis_result_clean_v2.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python source/scripts/install_dependencies.py
          pip install pytest httpx

      - name: Run full test suite
        working-directory: source
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/aquametric_ci.db
          UPLOAD_DIR: /tmp/aquametric_uploads_ci
          EVIDENCE_DIR: /tmp/aquametric_evidence_ci
          SECRET_KEY: ci-only-secret
        run: python -m pytest -q

      - name: Smoke test FastAPI
        working-directory: source
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/aquametric_smoke.db
          UPLOAD_DIR: /tmp/aquametric_uploads_smoke
          EVIDENCE_DIR: /tmp/aquametric_evidence_smoke
          SECRET_KEY: ci-only-secret
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app
          c = TestClient(app)
          for path in ('/health','/'):
              r = c.get(path)
              print(path, r.status_code)
              assert r.status_code < 500
          PY
