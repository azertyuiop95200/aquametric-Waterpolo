name: AquaMetric V12.2 Mobile Regression

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/v121-mobile-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mobile-and-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply idempotent V12 integration patch
        run: python source/scripts/apply_v12_patch.py
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AquaMetric
        run: |
          python -m pip install --upgrade pip
          pip install -r source/requirements.txt
      - name: Run full Python suite
        working-directory: source
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/aquametric_v122_tests.db
          UPLOAD_DIR: /tmp/aquametric_v122_uploads
          EVIDENCE_DIR: /tmp/aquametric_v122_evidence
          SECRET_KEY: v122-test-secret
          COOKIE_SECURE: '0'
          WEB_DEMO_MODE: '0'
          AUTO_REFRESH_OFFICIAL_DATA: '0'
        run: python -m pytest -q
      - name: Start AquaMetric test server
        working-directory: source
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/aquametric_v122_browser.db
          UPLOAD_DIR: /tmp/aquametric_v122_browser_uploads
          EVIDENCE_DIR: /tmp/aquametric_v122_browser_evidence
          SECRET_KEY: v122-browser-secret
          COOKIE_SECURE: '0'
          WEB_DEMO_MODE: '1'
          AUTO_REFRESH_OFFICIAL_DATA: '0'
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 10000 >/tmp/aquametric-browser.log 2>&1 &
          echo $! >/tmp/aquametric-browser.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquametric-browser.log
          exit 1
      - name: Install browser test driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null
          CHROME_BIN="$(which google-chrome || which google-chrome-stable || which chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Test iPhone menu, five languages, tactics and player dossiers
        run: |
          node <<'JS'
          const { chromium } = require('playwright-core');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          (async()=>{
            const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME_BIN, args:['--no-sandbox','--disable-dev-shm-usage']});
            const page = await browser.newPage({viewport:{width:390,height:844}, isMobile:true, hasTouch:true});
            const base='http://127.0.0.1:10000';
            await page.goto(base+'/demo-login',{waitUntil:'networkidle'});
            await page.waitForURL('**/my-team');
            const original=page.url();
            const toggle=page.locator('[data-menu-toggle]');
            assert(await toggle.isVisible(),'mobile menu button is not visible');
            await toggle.click(); await page.waitForTimeout(250);
            assert(await page.locator('#sidebar').evaluate(el=>el.classList.contains('open')),'sidebar did not open');
            const nav=page.locator('#sidebar .side-nav');
            const dims=await nav.evaluate(el=>({scrollHeight:el.scrollHeight,clientHeight:el.clientHeight,overflow:getComputedStyle(el).overflowY,touch:getComputedStyle(el).touchAction}));
            assert(dims.scrollHeight>dims.clientHeight,'sidebar navigation is not vertically scrollable');
            assert(['auto','scroll'].includes(dims.overflow),'sidebar overflow-y is not scrollable');
            assert(dims.touch!=='none','sidebar touch scrolling is disabled');
            assert(await page.locator('[data-lang-choice]').count()===5,'five-language dock is missing');
            await page.mouse.click(378,420); await page.waitForTimeout(180);
            assert(!(await page.locator('#sidebar').evaluate(el=>el.classList.contains('open'))),'sidebar did not close outside');
            assert(page.url()===original,'closing menu changed current page');
            await page.selectOption('#lang','fr'); await page.waitForTimeout(150);
            assert((await page.locator('[data-i18n="nav.dashboard"]').innerText()).trim()==='Tableau de bord','French nav translation failed');
            await page.goto(base+'/knowledge',{waitUntil:'networkidle'});
            assert(await page.locator('.tactic-board-card').count()>=8,'visual tactical boards are missing');
            assert(await page.locator('.source-row,.reference-row').count()===0,'knowledge page still exposes source ledger');
            assert((await page.locator('[data-i18n="learning.title"]').innerText()).includes('tablette'),'French visual-knowledge translation failed');
            await page.goto(base+'/scouting?kind=club',{waitUntil:'networkidle'});
            const teamCards=page.locator('.scout-card'); assert(await teamCards.count()>=8,'scouting team choice is too narrow');
            const lille=teamCards.filter({hasText:'Lille'}).first(); assert(await lille.count()===1,'Lille team card missing');
            await lille.click(); await page.waitForLoadState('networkidle');
            const playerCards=page.locator('.scout-player-card'); assert(await playerCards.count()>0,'scouting players are not rendered as dossier links');
            const href=await playerCards.first().getAttribute('href'); assert(href&&href.includes('/intelligence/player?name='),'scouting player is not linked to dossier');
            await page.goto(base+'/intelligence/player?name=Cecilia%20Nardini',{waitUntil:'networkidle'});
            assert(page.url().includes('/profiles/players/'),'player resolver did not open canonical profile');
            assert(await page.locator('.career-panel').count()===1,'career panel missing from player dossier');
            assert((await page.locator('body').innerText()).includes('7 buts en finale'),'Cecilia sourced final highlight missing');
            await page.goto(base+'/analysis-history',{waitUntil:'networkidle'});
            assert(await page.locator('[data-i18n="history.title"]').count()===1,'saved analysis history route missing');
            await page.goto(base+'/transfer-watch',{waitUntil:'networkidle'});
            assert(await page.locator('.market-year').count()>0,'transfer page grouping missing');
            await page.goto(base+'/simulation',{waitUntil:'networkidle'});
            assert(await page.locator('.simulation-score').count()===1,'match simulation UI missing');
            await page.goto(base+'/coaches',{waitUntil:'networkidle'});
            assert((await page.locator('body').innerText()).length>100,'coach page did not render');
            console.log('V12.2 mobile regression: scroll, 5 languages, visual tactics, teams, player dossiers and analysis history OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/aquametric-browser.log || true
