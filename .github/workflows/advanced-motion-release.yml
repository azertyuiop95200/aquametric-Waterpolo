name: Advanced motion release gate
on:
  pull_request:
    branches: [feature/elite-performance-2026]
    paths: ['source/**', '.github/workflows/advanced-motion-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jinja2 fastapi sqlalchemy pytest pydantic opencv-python-headless numpy
      - run: python -m compileall -q source
      - working-directory: source
        run: |
          python -m unittest discover -s tests -p test_advanced_motion_release.py -v
          python -m unittest discover -s tests -p test_advanced_occupation_release.py -v
          python -m unittest discover -s tests -p test_identity_aggregation.py -v
          python -m unittest discover -s tests -p test_metric_field.py -v
          python -m unittest discover -s tests -p test_guest_full_policy.py -v
          python -m unittest discover -s tests -p test_elite_performance.py -v
      - working-directory: source
        env:
          PYTHONPATH: .:tests
        run: |
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader, StrictUndefined
          from types import SimpleNamespace
          from services.advanced_motion_report import build
          from test_advanced_motion_release import fixture
          env = Environment(loader=FileSystemLoader('templates'), undefined=StrictUndefined, autoescape=True)
          for name in ('analysis_result_clean_v2.html','analysis_report_portable.html','analysis_all_measurements.html','advanced_motion_rows.html'):
              env.get_template(name)
          for snapshot in (fixture(), {}):
              snapshot['advanced_motion'] = build(snapshot)
              html = env.get_template('advanced_motion_rows.html').render(snapshot=snapshot,match=SimpleNamespace(team=SimpleNamespace(name='A'),opponent='B'))
              assert 'Déplacements et efforts observés' in html
          PY
