name: Validate AquaMetric V12.1
# validation-trigger: ux-intelligence-v12-1

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'Dockerfile'
      - '.github/workflows/finalize-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V12 integration patch
        run: python source/scripts/apply_v12_patch.py

      - name: Apply V12.5 tactical video integration
        run: python source/scripts/apply_v121_tactical_patch.py

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r source/requirements.txt

      - name: Debug V12 route registration
        working-directory: source
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/aquametric_v12_debug.db
          UPLOAD_DIR: /tmp/aquametric_v12_uploads_debug
          EVIDENCE_DIR: /tmp/aquametric_v12_evidence_debug
          SECRET_KEY: v12-debug-secret-key-only
          COOKIE_SECURE: '0'
          WEB_DEMO_MODE: '0'
        run: |
          python - <<'PY'
          import extensions
          print('extension router routes:', [getattr(r, 'path', None) for r in extensions.router.routes])
          from main import app
          paths = sorted({getattr(r, 'path', '') for r in app.routes})
          print('app V12 routes:', [p for p in paths if 'intelligence' in p or 'coach' in p or 'profiles' in p or 'study-pack' in p])
          assert '/matches/{match_id}/intelligence/study-pack' in paths
          PY

      - name: Run full AquaMetric test suite
        working-directory: source
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/aquametric_v12_ci.db
          UPLOAD_DIR: /tmp/aquametric_v12_uploads
          EVIDENCE_DIR: /tmp/aquametric_v12_evidence
          SECRET_KEY: v12-ci-secret-key-only
          COOKIE_SECURE: '0'
          WEB_DEMO_MODE: '0'
        run: python -m pytest -q

      - name: Smoke test V12 routes and security headers
        working-directory: source
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/aquametric_v12_smoke.db
          UPLOAD_DIR: /tmp/aquametric_v12_uploads_smoke
          EVIDENCE_DIR: /tmp/aquametric_v12_evidence_smoke
          SECRET_KEY: v12-smoke-secret-key-only
          COOKIE_SECURE: '0'
          WEB_DEMO_MODE: '0'
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app
          paths = {getattr(r, 'path', None) for r in app.routes}
          assert '/matches/{match_id}/intelligence' in paths
          assert '/matches/{match_id}/intelligence/study-pack' in paths
          assert '/profiles/players/{profile_id}' in paths
          assert '/coach-intelligence/{coach_id}' in paths
          assert '/simulation' in paths
          c = TestClient(app)
          r = c.get('/health')
          assert r.status_code == 200, r.text
          assert r.headers.get('x-content-type-options') == 'nosniff'
          assert r.headers.get('content-security-policy')
          print('health:', r.json())
          print('V12.5 tactical routes + security headers: OK')
          PY

      - name: Publish integrated source after green validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source
          if git diff --cached --quiet; then
            echo 'V12.5 integration already present on this checkout.'
            exit 0
          fi

          git commit -m 'Integrate AquaMetric V12.5 source after validation'

          # Other AquaMetric workflows can legitimately advance main while this
          # relatively long FFmpeg/Tesseract test job is running. Rebase the
          # already validated patch onto the newest main instead of force-pushing
          # or overwriting unrelated work. A real conflict fails safely.
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Validated V12.5 source published.'
              exit 0
            fi
            sleep 2
          done
          echo 'Could not publish after three non-fast-forward retries.' >&2
          exit 1
