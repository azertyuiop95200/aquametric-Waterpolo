name: AquaMetric V12.1 Tactical Video

on:
  push:
    branches: [main]
    paths:
      - 'source/tactical_media_routes.py'
      - 'source/scripts/apply_v121_tactical_patch.py'
      - '.github/workflows/v121-tactical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tactical integration patch
        run: python source/scripts/apply_v121_tactical_patch.py

      - name: Publish integrated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/extensions.py
          if git diff --cached --quiet; then
            echo 'Tactical integration already present.'
          else
            git commit -m 'Integrate tactical study pack routes [skip ci]'
            git push
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r source/requirements.txt

      - name: Run complete test suite
        working-directory: source
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/aquametric_v121_ci.db
          UPLOAD_DIR: /tmp/aquametric_v121_uploads
          EVIDENCE_DIR: /tmp/aquametric_v121_evidence
          SECRET_KEY: v121-ci-secret-key-only
          COOKIE_SECURE: '0'
          WEB_DEMO_MODE: '0'
        run: python -m pytest -q

      - name: Smoke test tactical study pack route
        working-directory: source
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:////tmp/aquametric_v121_smoke.db
          UPLOAD_DIR: /tmp/aquametric_v121_uploads_smoke
          EVIDENCE_DIR: /tmp/aquametric_v121_evidence_smoke
          SECRET_KEY: v121-smoke-secret-key-only
          COOKIE_SECURE: '0'
          WEB_DEMO_MODE: '0'
        run: |
          python - <<'PY'
          from main import app
          from tactical_media_routes import sequence_review
          paths = {(getattr(r,'path',None), tuple(sorted(getattr(r,'methods',[]) or []))) for r in app.routes}
          assert any(p == '/matches/{match_id}/intelligence/study-pack' and 'POST' in methods for p, methods in paths)
          review = sequence_review({'phase':'power_play','passes':4,'shots_for':1,'goals_for':1,'losses_for':0,'goals_against':0,'time_to_first_shot':7.2})
          assert 'Zone+' in review['objective']
          assert '7.2' in review['tempo']
          print('Tactical study-pack route and coaching review: OK')
          PY
